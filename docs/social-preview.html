<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AgriFlock 360 social preview artwork</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1200px; height: 630px; }
      body { font-family: Arial, Helvetica, sans-serif; background: #fff; color: #155531; }
      .preview { position: relative; width: 1200px; height: 630px; border-top: 12px solid #155531; overflow: hidden; }
      .content { height: 522px; display: grid; grid-template-columns: 386px 1fr; align-items: center; gap: 52px; padding: 42px 64px; }
      .logo { width: 350px; height: 350px; object-fit: contain; }
      .copy { border-left: 2px solid #e4eae2; padding-left: 50px; }
      .eyebrow { margin: 0 0 20px; font-size: 20px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
      h1 { font-size: 62px; line-height: 1.05; letter-spacing: -2.5px; margin: 0 0 24px; }
      .description { color: #4f4f4f; font-size: 24px; line-height: 1.5; margin: 0; }
      footer { height: 96px; padding: 0 64px; display: flex; align-items: center; justify-content: space-between; background: #155531; color: white; }
      .address { font-size: 24px; font-weight: 700; }
      .audience { font-size: 20px; color: #f3ddaa; }
    </style>
  </head>
  <body>
    <!-- Source artwork: render at 1200 x 630 and export to public/agriflock360-social-preview.png. -->
    <main class="preview">
      <div class="content">
        <img class="logo" src="../src/assets/agriflock-logo-new.png" alt="AgriFlock 360" />
        <div class="copy">
          <p class="eyebrow">AgriFlock 360</p>
          <h1>Smart poultry<br />farming.</h1>
          <p class="description">Manage your flock, plan feeding and vaccinations, and connect with poultry professionals.</p>
        </div>
      </div>
      <footer>
        <span class="address">agriflock360.com</span>
        <span class="audience">For farmers, vets &amp; extension officers</span>
      </footer>
    </main>
  </body>
</html>
